services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentimentor
      POSTGRES_USER: sentimentor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentimentor -d sentimentor"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  coordinator:
    build: ./coordinator
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentimentor:${POSTGRES_PASSWORD}@postgres:5432/sentimentor
      KEYS_FILE: /app/keys.json
    volumes:
      - ./coordinator/keys.json:/app/keys.json:ro
    ports:
      - "127.0.0.1:8000:8000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  sentiment-worker:
    build: ./sentiment-worker
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_started
    environment:
      COORDINATOR_URL: http://coordinator:8000
      API_KEY: ${SENTIMENT_KEY}
      LLM_BACKEND: ${LLM_BACKEND:-openrouter}
      LLM_MODEL: ${LLM_MODEL:-google/gemma-4-31b-it:free}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_CHUNK_CHARS: ${LLM_CHUNK_CHARS:-4000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      SENTIMENT_BATCH_SIZE: ${SENTIMENT_BATCH_SIZE:-20}
      PROMPT_VERSION: ${PROMPT_VERSION:-v1}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  scraper-worker-1:
    build: ./scraper-worker
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_started
    environment:
      COORDINATOR_URL: http://coordinator:8000
      API_KEY: ${SCRAPER_KEY_1}
      WORKER_ID: nalu01-scraper-1
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-500000}
      GOTO_TIMEOUT: ${GOTO_TIMEOUT:-30000}
      WAIT_MS: ${WAIT_MS:-3000}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-120}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  scraper-worker-2:
    build: ./scraper-worker
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_started
    environment:
      COORDINATOR_URL: http://coordinator:8000
      API_KEY: ${SCRAPER_KEY_2}
      WORKER_ID: nalu01-scraper-2
      MAX_TEXT_CHARS: ${MAX_TEXT_CHARS:-500000}
      GOTO_TIMEOUT: ${GOTO_TIMEOUT:-30000}
      WAIT_MS: ${WAIT_MS:-3000}
      FETCH_TIMEOUT: ${FETCH_TIMEOUT:-120}
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  tools:
    build: ./tools
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://sentimentor:${POSTGRES_PASSWORD}@postgres:5432/sentimentor
    volumes:
      - ./tools:/app/tools
    working_dir: /app

volumes:
  postgres_data:
